version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories: [/engine, /ui/editor]
    # Compiler API migrations and Node runtime upgrades need coordinated changes.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: daily
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
  - package-ecosystem: docker
    directories: [/.github/security/clamav, /.github/security/semgrep]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  # The SDK pinned in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7
