name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  # The publish workflow calls this one, so a release waits on it and carries
  # the report it writes.
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-2025
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-24.04
            build-mode: none
          - language: actions
            os: ubuntu-24.04
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build C# with source generators for extraction
        if: matrix.language == 'csharp'
        run: dotnet build xlide_vbide.slnx --configuration Release --no-incremental -p:UseSharedCompilation=false
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          output: security-results/codeql-${{ matrix.language }}
          category: /language:${{ matrix.language }}
          upload: ${{ github.ref_type == 'tag' && 'never' || 'always' }}
      - name: Preserve results even when analysis fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-codeql-${{ matrix.language }}
          path: security-results/
          if-no-files-found: error
          retention-days: 30

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned Semgrep image
        run: docker build --quiet --tag semgrep-pinned .github/security/semgrep
      # The runner's user owns the checkout, so Semgrep runs as that user to
      # read it through git and to write results the later steps can read.
      - name: Scan all tracked source with security and secrets rules
        run: |
          mkdir -p security-results/semgrep
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/src" --workdir /src semgrep-pinned \
            semgrep scan --config p/security-audit --config p/secrets \
            --error --strict --disable-nosem --metrics off --disable-version-check \
            --sarif-output security-results/semgrep/semgrep.sarif .
      - name: Upload to code scanning
        if: always() && github.ref_type != 'tag' && hashFiles('security-results/semgrep/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: security-results/semgrep/semgrep.sarif
          category: semgrep
      - name: Preserve results even when analysis fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-semgrep
          path: security-results/
          if-no-files-found: error
          retention-days: 30

  # Known advisories in the locked npm and NuGet dependencies, development
  # tools included. Any advisory fails, whatever its severity. npm reads only
  # the lockfiles and runs no install scripts; NuGet needs a restore first,
  # on Windows because the projects target net10.0-windows.
  dependencies:
    name: Dependency audit
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Audit the npm lockfiles
        shell: bash
        run: |
          status=0
          for project in engine ui/editor; do
            echo "npm audit: $project"
            npm audit --prefix "$project" --package-lock-only --ignore-scripts --include=dev --audit-level=info || status=1
          done
          exit "$status"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore NuGet packages
        run: dotnet restore xlide_vbide.slnx
      # The list command exits 0 even when it finds a vulnerable package, so
      # its JSON is read instead: a package listed under any project fails.
      - name: Audit the NuGet packages
        shell: bash
        run: |
          dotnet list xlide_vbide.slnx package --vulnerable --include-transitive --format json > nuget-audit.json
          node -e '
            const audit = JSON.parse(require("node:fs").readFileSync("nuget-audit.json", "utf8"));
            if (!audit.projects?.length) throw new Error("No projects were audited");
            let vulnerable = 0;
            for (const project of audit.projects) {
              for (const framework of project.frameworks ?? []) {
                for (const item of [...(framework.topLevelPackages ?? []), ...(framework.transitivePackages ?? [])]) {
                  vulnerable++;
                  console.log(`${project.path}: ${item.id} ${item.resolvedVersion}`);
                  for (const advisory of item.vulnerabilities ?? []) console.log(`  ${advisory.severity} ${advisory.advisoryurl}`);
                }
              }
            }
            for (const problem of audit.problems ?? []) { vulnerable++; console.log(problem.text ?? JSON.stringify(problem)); }
            console.log(`${audit.projects.length} projects audited, ${vulnerable} vulnerable packages or problems`);
            process.exitCode = vulnerable ? 1 : 0;
          '

  # zizmor audits the workflows themselves: template injection, credential
  # persistence, over-broad permissions, dangerous triggers, and actions with
  # known advisories or impostor commits. Findings it should not raise are
  # turned off in .github/zizmor.yml or ignored inline, each with its reason;
  # anything else fails the job.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install zizmor
        run: python -m pip install --require-hashes -r .github/requirements/zizmor.txt

      # The token lets the online audits look up advisories and check that each
      # pinned SHA belongs to the action it names.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          zizmor --format sarif .github/workflows > zizmor.sarif || status=$?
          zizmor --format plain .github/workflows || true
          exit "$status"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  report:
    name: Security report
    if: always()
    needs: [codeql, semgrep, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: security-*
          path: security-results
          merge-multiple: true
      - name: Write report and reject findings or incomplete scans
        if: always()
        env:
          SCANNER_STATUS: ${{ toJSON(needs) }}
        run: node tools/security/report.mjs security-results security-report
      - name: Test failure handling
        if: always()
        run: node --test tools/security/*.test.mjs
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: security-report/
          if-no-files-found: error
          retention-days: 90

  security-passed:
    name: Security passed
    if: always()
    needs: [codeql, semgrep, dependencies, zizmor, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
