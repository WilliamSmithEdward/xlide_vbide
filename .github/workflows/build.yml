name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # The ENGINE, which had no CI at all until 2026-08-07 -- including the smoke test that pins
  # every rename and navigation fix from the adversarial pass.
  #
  # It is its own job because it needs the companion repo checked out beside this one: the
  # analyzer is not vendored here, it is imported straight out of ../xlide_vscode/src, which is
  # what keeps the two products analysing VBA identically. A job that cannot see it cannot build
  # the engine, which is why the engine was never built here.
  #
  # Ubuntu as well as Windows, deliberately. The engine is plain Node and the language matrix is
  # about text, so a difference in the runner's ICU build is exactly the kind of thing that shows
  # up on one platform and not the other. The companion's language job runs both for the same
  # reason.
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          path: xlide_vbide

      # The analyzer. Pinned to nothing: the two move together on purpose, and a green run here
      # against yesterday's analyzer would be the opposite of what this job is for.
      - uses: actions/checkout@v4
        with:
          repository: WilliamSmithEdward/xlide_vscode
          path: xlide_vscode

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the companion's dependencies
        working-directory: xlide_vscode
        run: npm ci

      - name: Install the engine's dependencies
        working-directory: xlide_vbide/engine
        run: npm ci

      - name: Typecheck the engine
        working-directory: xlide_vbide/engine
        run: npm run check-types

      - name: Build the engine
        working-directory: xlide_vbide/engine
        run: npm run build

      # Analysis over a real pipe: the rename and navigation cases from the bug hunts.
      - name: Engine smoke
        working-directory: xlide_vbide/engine
        run: node test/smoke.mjs

      # Non-ASCII through every path that carries it. This repo's exposure is not the companion's:
      # it never decodes the workbook's bytes, so what breaks here is OFFSET ARITHMETIC -- a
      # position counted in bytes or code points rather than UTF-16 code units drifts by the width
      # of the text to its left, which no English fixture can show and which corrupts an edit
      # rather than failing one.
      #
      # Import and export are in here too, since 2026-08-09. The planner behind them is the
      # companion's own and it is the DEFAULT, its exposure is the same arithmetic one layer along,
      # and it had no language coverage anywhere. Running on both runners is the point: string
      # comparison and normalisation are the runtime's, so a difference in the runner's ICU build
      # shows on one and not the other. Precomposed and decomposed spellings of one word are a case
      # of their own, because a repository authored on macOS carries the second.
      - name: Language matrix
        working-directory: xlide_vbide/engine
        run: node test/language.mjs

      # A form's controls are declared by the DESIGNER, not the text: the host seeds them and
      # the analyzer treats them as declared (xlide_vscode#17..#20). The call-colouring table
      # is exact - a resolved method call paints `function`, a property or an unresolved member
      # paints nothing - and because the checkout beside this one is unpinned, this is the job
      # that notices the analyzer's main moving under that table.
      - name: Forms
        working-directory: xlide_vbide/engine
        run: node test/forms.mjs

      # A finding's position against the text it was actually measured in. The engine chooses
      # between its live copy of a module and the seeded one whenever a request carries no source,
      # and that choice is invisible to the caller -- which converted offsets against whatever
      # text it held, and drew a squiggle six columns left of the word it was about for as long as
      # the two differed. This drives the two copies apart on purpose and asserts the invariant.
      - name: Positions
        working-directory: xlide_vbide/engine
        run: node test/positions.mjs

      # The memo that answers diagnostics from the last analysis when nothing it depends on has
      # changed, which is what turned a pass over an 82,000-line project from 476ms into 34ms. The
      # saving is only correct if "nothing it depends on" is exact, and it was not: the project's
      # procedure signatures ride in a Map, `JSON.stringify` renders a Map as `{}`, and the
      # fingerprint therefore could not see a signature change at all. Adding a parameter left
      # every caller un-analysed, with nothing red and nothing slow to notice.
      #
      # This test was written for that and then run by nothing - not this job, which listed its
      # three siblings by name, and not verify.ps1. It needs no Excel and no fixture, so there was
      # never a reason beyond nobody adding the line.
      - name: Freshness
        working-directory: xlide_vbide/engine
        run: node test/freshness.mjs

      # A repeat analysis of one module must not cost more than the first analysis of it. The
      # analyzer memoises per source string and finds its entries with `===`, which settles on the
      # pointer inside one analysis and compares a megabyte of characters across two - so a module
      # arriving again over the pipe, as a new string with the same content, made every one of the
      # hundreds of thousands of memo lookups in a pass a full scan of the module. The 64,802-line
      # fixture went from 0.9s for its first analysis to 15.8s for every one after, which is what
      # the editor freezing for ten to fifteen seconds after a keystroke actually was.
      #
      # It asserts a RATIO against the module's own first analysis, so it carries across runners.
      - name: Pass cost
        working-directory: xlide_vbide/engine
        run: node test/pass-cost.mjs

  build:
    # Windows is required: the product is a native COM server for a Windows host, and ahead-of-time
    # publishing needs the platform linker, which the Windows runner image already carries.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/editor/package-lock.json

      # The surface is most of the product and none of it was reaching this workflow. `dist/`
      # is not committed, so a run that never built the page published a shim carrying no
      # editor at all — a green build whose artifact shows the native pane and logs "no
      # bundle" — and a TypeScript error merged just as green (2026-08-06). Building the page
      # BEFORE the publish also puts the bundle where the shim's csproj expects to find it.
      - name: Install the page's dependencies
        working-directory: ui/editor
        run: npm ci

      # No spec repo here to compare against, so this confirms the vendored copy matches the
      # manifest it was taken with -- enough to catch a file edited in place rather than synced.
      - name: Check the vendored spec copy
        working-directory: ui/editor
        run: npm run spec:check

      - name: Typecheck the page
        working-directory: ui/editor
        run: npm run typecheck

      - name: Build the page
        working-directory: ui/editor
        run: npm run build

      - name: Check the page bundle
        working-directory: ui/editor
        run: npm test

      # THE TWO CHEAPEST CHECKS IN THE LOCAL GATE, and neither ran here until 2026-08-11.
      #
      # Both take well under a second and both guard a class of defect that is invisible in review.
      # The route audit asks whether every xlide-api route is documented in both places, reachable
      # from the client, and driven by a suite the gate actually runs - a question that goes wrong
      # by one route at a time and is never noticed at the moment it does. The variant guard is the
      # shape check for the 2026-08-05 crash storm, where a VARIANT declared 16 bytes on an x64
      # host wrote 8 bytes past its buffer and the symptom was stack-layout roulette.
      #
      # They need no Excel and no publish, so they belong in front of the expensive steps.
      - name: Audit the xlide api's routes
        run: node tools/harness/audit-routes.mjs

      - name: Check that no variant is read as an object
        shell: pwsh
        run: |
          $offenders = Get-ChildItem src -Recurse -Include *.cs |
              Select-String -Pattern '\.As<\s*object\s*>\s*\(' |
              Where-Object { $_.Line -notmatch '^\s*(//|\*|/\*)' }

          if ($offenders) {
              $where = ($offenders | ForEach-Object { "$($_.Filename):$($_.LineNumber)" }) -join ', '
              throw ("a variant is being read as an object ($where). That builds a COM wrapper " +
                  'nothing owns and the finalizer thread releases it, which ends Excel. Name the ' +
                  'variant type and describe it, or take it through ComRuntime.')
          }

          Write-Host 'no path materialises a wrapper the counter cannot see'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # These cover everything that does not need a host: registration, layout arithmetic, edit
      # reconciliation, protocol handling. The editor is exercised separately, on a machine that
      # has one.
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      # NAMED SEPARATELY THOUGH THE STEP ABOVE ALREADY RAN THEM, and it costs about a second.
      #
      # Import and export are where language goes wrong quietly: file names, whether two texts are
      # the same, where a difference is drawn, and how many lines agreed are all counts, and a count
      # taken in the wrong unit drifts by the width of the non-ASCII text to its left. When that
      # breaks, "Test failed" in a run of hundreds is a worse first sentence than "Languages
      # failed". The half that needs a real Excel is the HOST's code-page conversion, and that runs
      # in the live gate instead (tools\harness\module-sync.mjs, section 7).
      - name: Languages
        run: dotnet test --no-build -c Release --filter "FullyQualifiedName~Language|FullyQualifiedName~ModuleTextConversion"

      - name: Publish the native shim
        run: dotnet publish src/Xlide.Vbe.Shim/Xlide.Vbe.Shim.csproj -c Release -r win-x64

      - name: Check that the shim is a native server
        shell: pwsh
        run: |
          $shim = 'artifacts/publish/Xlide.Vbe.Shim/release_win-x64/Xlide.Vbe.Shim.dll'
          if (-not (Test-Path $shim)) { throw "No shim was published at $shim." }

          $size = (Get-Item $shim).Length / 1MB
          Write-Host ('Shim is {0:N2} MB.' -f $size)

          # A runtime-hosted build would drag a runtime alongside it. Catching that here keeps the
          # no-runtime-on-the-user's-machine promise from regressing quietly.
          $runtime = Get-ChildItem (Split-Path $shim) -Filter 'hostfxr.dll' -ErrorAction SilentlyContinue
          if ($runtime) { throw 'A runtime was published next to the shim. The build is no longer ahead-of-time.' }

      - name: Check that the shim carries the editor page
        shell: pwsh
        run: |
          # The shim without its page is a shim that shows the native pane. This used to pass
          # silently because the glob that copies the bundle matches nothing when the bundle
          # was never built.
          $root = 'artifacts/publish/Xlide.Vbe.Shim/release_win-x64/ui/editor/dist'
          foreach ($needed in 'index.html', 'editor.js', 'editor.css', 'editor.worker.js', 'codicon.ttf') {
            $file = Join-Path $root $needed
            if (-not (Test-Path $file)) { throw "The published shim is missing $needed; it would show the native pane." }
          }

          $bundle = (Get-Item (Join-Path $root 'editor.js')).Length / 1MB
          Write-Host ('Editor bundle is {0:N2} MB.' -f $bundle)
          if ($bundle -lt 0.5) { throw 'The editor bundle is implausibly small; the build produced a stub.' }

      # The api SHIPS now, and ships shut. So the question is no longer whether any of it is in
      # the binary - it all is, by design - but which way the shipped build LEANS, which is a
      # `#if` somebody could write the wrong way round without any test noticing. The lean is a
      # const and the log line is a ternary over it, so the compiler folds it and exactly one of
      # two phrases survives; proving the absent one is absent is what makes this a real check
      # rather than a search that always succeeds.
      - name: Check that Release ships the api shut
        shell: pwsh
        run: |
          $shim = 'artifacts/bin/Xlide.Vbe.Shim/release_win-x64/Xlide.Vbe.Shim.dll'
          if (-not (Test-Path $shim)) { throw "No managed Release assembly at $shim to check." }

          # BOTH ALIGNMENTS. A .NET string literal lives in the #US heap as UTF-16 and nothing
          # makes it start on an even byte, so decoding from offset 0 alone garbles every literal
          # that lands on an odd one - which reads as "not found" and passes having checked
          # nothing. This scan had one alignment until 2026-08-22.
          $bytes = [IO.File]::ReadAllBytes($shim)
          $text = [Text.Encoding]::Unicode.GetString($bytes) +
            [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1) +
            [Text.Encoding]::ASCII.GetString($bytes)

          $shut = 'this build keeps the door shut unless told otherwise'
          $open = 'this build opens the door unless told otherwise'
          if (-not $text.Contains($shut)) { throw 'Release does not say it ships the api shut.' }
          if ($text.Contains($open)) { throw "RELEASE SHIPS THE API OPEN: found '$open'." }
          if (-not $text.Contains('xlide-api-')) { throw 'Release carries no api at all.' }

          # The DevTools protocol is NOT part of the api and must never ship: it takes no token,
          # and --remote-allow-origins=* means anything local that reaches the port drives the
          # page.
          foreach ($needle in '--remote-debugging-port', '--remote-allow-origins') {
            if ($text.Contains($needle)) { throw "Release carries an unauthenticated door: found '$needle'." }
          }
          Write-Host 'Release ships the api shut, and no unauthenticated door.'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shim
          path: artifacts/publish/Xlide.Vbe.Shim/release_win-x64/
          if-no-files-found: error
