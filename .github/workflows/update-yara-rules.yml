name: Update YARA rules

on:
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yara-forge-rule-update
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify new rule release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.proposal.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r .github/security/malware/requirements.txt
      - name: Fetch latest stable upstream release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/YARAHQ/yara-forge/releases/latest > "$RUNNER_TEMP/yara-release.json"
      - name: Verify archive and prepare the pinned proposal
        id: proposal
        run: python tools/security/update_yara.py prepare --release "$RUNNER_TEMP/yara-release.json" --output proposal
      - name: Preserve proposal and compiler evidence
        if: always() && hashFiles('proposal/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yara-forge-proposal
          path: proposal/
          if-no-files-found: error
          retention-days: 30

  propose:
    name: Propose a YARA rule update
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Only trusted main code runs with write permissions; it never loads the rule archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yara-forge-proposal
          path: proposal
      - name: Publish proposal and explicitly dispatch Malware scan and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/security/update_yara.py publish --output proposal
