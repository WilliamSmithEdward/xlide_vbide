<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xlide</title>
<!--
  Placeholder surface for the docked tool window.

  It is composed by the shim and pushed into the browser as a string, so it has no origin and can
  load nothing from disk or the network. Everything it needs is in this one file. The token below
  is replaced with the browser version before the document is handed over; seeing a real version
  number is the proof that the environment, the controller, and the navigation all completed.
-->
<style>
  :root {
    color-scheme: light dark;

    --surface: #ffffff;
    --surface-raised: #f5f5f7;
    --border: #d9d9de;
    --text: #1b1b1f;
    --text-muted: #5f5f6b;
    --accent: #2f6fed;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1b1b1f;
      --surface-raised: #232329;
      --border: #35353d;
      --text: #ececf1;
      --text-muted: #9a9aa6;
      --accent: #6f9dff;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
    background: var(--surface);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  h1 .mark {
    color: var(--accent);
  }

  p {
    margin: 0;
    color: var(--text-muted);
    max-width: 46ch;
  }

  dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    align-items: baseline;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-raised);
  }

  dt {
    color: var(--text-muted);
    white-space: nowrap;
  }

  dd {
    margin: 0;
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    font-size: 12px;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <h1><span class="mark">xlide</span></h1>
  <p>The tool window host is sited and the browser surface is live. This placeholder is replaced by
  the editor shell.</p>
  <dl>
    <dt>WebView2 runtime</dt>
    <dd>{{WEBVIEW2_VERSION}}</dd>
    <dt>User agent</dt>
    <dd id="agent">unknown</dd>
    <dt>Surface</dt>
    <dd id="surface">unknown</dd>
  </dl>
<script>
  document.getElementById("agent").textContent = navigator.userAgent;

  function reportSurface() {
    document.getElementById("surface").textContent =
      window.innerWidth + " x " + window.innerHeight;
  }

  reportSurface();
  window.addEventListener("resize", reportSurface);
</script>
</body>
</html>
